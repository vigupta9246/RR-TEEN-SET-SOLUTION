<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonials Admin — R.R Teen Set Solution</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f4f6f9;color:#0a1628;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:30px 5% 60px}
h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;margin-bottom:6px}
.sub{color:#6b7f96;font-size:14px;margin-bottom:28px}
.login-screen{max-width:360px;margin:80px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 40px rgba(10,22,40,.1);text-align:center}
.login-screen input{width:100%;padding:12px 14px;border:1.5px solid #dde5ee;border-radius:9px;font-size:14px;margin-bottom:12px}
.login-screen button{width:100%;padding:12px;border:none;border-radius:9px;background:#1565c0;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}
.login-err{color:#c0392b;font-size:12.5px;margin-top:10px;display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.signout-btn{background:none;border:1.5px solid #dde5ee;border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:700;color:#6b7f96;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab-btn{padding:9px 18px;border-radius:8px;border:1.5px solid #dde5ee;background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:#6b7f96}
.tab-btn.active{background:#1565c0;border-color:#1565c0;color:#fff}
.rev-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(10,22,40,.06);border-left:4px solid #ddd}
.rev-card.pending{border-left-color:#d79922}
.rev-card.approved{border-left-color:#1a9a53}
.rev-card.rejected{border-left-color:#c0392b}
.rev-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.rev-name{font-weight:800;font-size:15px}
.rev-meta{font-size:12px;color:#8a9bb5}
.rev-stars{color:#f5b301;font-size:15px;white-space:nowrap}
.rev-text{font-size:14px;color:#3a4a5a;line-height:1.7;margin:10px 0}
.rev-actions{display:flex;gap:8px;margin-top:12px}
.rev-actions button{padding:8px 16px;border-radius:7px;border:none;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-approve{background:#1a9a53;color:#fff}
.btn-reject{background:#fdecea;color:#c0392b}
.btn-delete{background:#f2f4f7;color:#6b7f96}
.empty{text-align:center;padding:50px 20px;color:#8a9bb5;font-size:14px}
.loading{text-align:center;padding:50px 20px;color:#8a9bb5;font-size:14px}
.phone-line{font-size:12px;color:#8a9bb5;margin-top:4px}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div style="font-size:32px;margin-bottom:6px">🔒</div>
  <h1 style="font-size:20px">Admin Sign In</h1>
  <p style="font-size:12.5px;color:#8a9bb5;margin:6px 0 18px">Use the same login as the CRM</p>
  <input type="email" id="login-email" placeholder="Email" autocomplete="username">
  <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()">Sign In</button>
  <p class="login-err" id="login-err"></p>
</div>

<div class="wrap" id="admin-wrap" style="display:none">
  <div class="topbar">
    <div><h1>Testimonials Admin</h1><p class="sub" style="margin-bottom:0" id="who-line"></p></div>
    <button class="signout-btn" onclick="doSignOut()">Sign Out</button>
  </div>
  <p class="sub">Approve reviews before they appear on the public reviews page.</p>
  <div class="tabs">
    <button class="tab-btn active" data-f="pending" onclick="setFilter('pending')">Pending</button>
    <button class="tab-btn" data-f="approved" onclick="setFilter('approved')">Approved</button>
    <button class="tab-btn" data-f="rejected" onclick="setFilter('rejected')">Rejected</button>
    <button class="tab-btn" data-f="all" onclick="setFilter('all')">All</button>
  </div>
  <div id="rev-list"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, updateDoc, deleteDoc, orderBy, query }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0vwKNfJ4cb9WvGrir8U5oGyWdwNk3TvQ",
  authDomain: "rr-teen-set-quotation.firebaseapp.com",
  databaseURL: "https://rr-teen-set-quotation-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rr-teen-set-quotation",
  storageBucket: "rr-teen-set-quotation.firebasestorage.app",
  messagingSenderId: "871289668592",
  appId: "1:871289668592:web:6bda2d9f255e61294f1335",
  measurementId: "G-N28CZBQ66C"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Enter email and password.'; errEl.style.display = 'block'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    errEl.textContent = 'Sign-in failed — check your email/password (same login as the CRM).';
    errEl.style.display = 'block';
  }
};
window.doSignOut = function(){ signOut(auth); };

document.getElementById('login-pass').addEventListener('keydown', function(e){
  if (e.key === 'Enter') window.doLogin();
});

onAuthStateChanged(auth, function(user){
  if (user){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-wrap').style.display = 'block';
    document.getElementById('who-line').textContent = 'Signed in as ' + user.email;
    loadReviews();
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-wrap').style.display = 'none';
  }
});

let allReviews = [];
let currentFilter = 'pending';

window.setFilter = function(f){
  currentFilter = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
};

async function loadReviews(){
  const list = document.getElementById('rev-list');
  list.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const q = query(collection(db, 'testimonials'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    allReviews = [];
    snap.forEach(d => allReviews.push({ id: d.id, ...d.data() }));
    render();
  } catch(e) {
    list.innerHTML = '<div class="empty">Could not load reviews: ' + esc(e.message) + '<br><br>Make sure your account has a role (Admin/Sales/Accounts) in the CRM\'s users collection, and that Firestore rules for the \'testimonials\' collection have been published.</div>';
  }
}

function render(){
  const list = document.getElementById('rev-list');
  const filtered = currentFilter === 'all' ? allReviews : allReviews.filter(r => (r.status || 'pending') === currentFilter);
  if (filtered.length === 0){
    list.innerHTML = '<div class="empty">No reviews here yet.</div>';
    return;
  }
  list.innerHTML = filtered.map(r => {
    const st = r.status || 'pending';
    const stars = '★'.repeat(Math.round(r.rating||5)) + '☆'.repeat(5 - Math.round(r.rating||5));
    return `<div class="rev-card ${st}">
      <div class="rev-top">
        <div><div class="rev-name">${esc(r.name)}</div><div class="rev-meta">${esc(r.city||'')}${r.projectType ? ' · ' + esc(r.projectType) : ''}</div></div>
        <div class="rev-stars">${stars}</div>
      </div>
      <div class="rev-text">"${esc(r.text)}"</div>
      ${r.phone ? `<div class="phone-line">📞 ${esc(r.phone)} (not shown publicly)</div>` : ''}
      <div class="rev-actions">
        ${st !== 'approved' ? `<button class="btn-approve" onclick="approveReview('${r.id}')">✓ Approve</button>` : ''}
        ${st !== 'rejected' ? `<button class="btn-reject" onclick="rejectReview('${r.id}')">✕ Reject</button>` : ''}
        <button class="btn-delete" onclick="deleteReview('${r.id}')">🗑 Delete</button>
      </div>
    </div>`;
  }).join('');
}

window.approveReview = async function(id){
  await updateDoc(doc(db, 'testimonials', id), { status: 'approved' });
  const r = allReviews.find(x => x.id === id); if (r) r.status = 'approved';
  render();
};
window.rejectReview = async function(id){
  await updateDoc(doc(db, 'testimonials', id), { status: 'rejected' });
  const r = allReviews.find(x => x.id === id); if (r) r.status = 'rejected';
  render();
};
window.deleteReview = async function(id){
  if (!confirm('Delete this review permanently?')) return;
  await deleteDoc(doc(db, 'testimonials', id));
  allReviews = allReviews.filter(x => x.id !== id);
  render();
};
</script>
</body></html>
